# 广厦心安 · 多环境 Host 反代（local/dev/test/prod）
upstream zhongjian_eap_site_prod  { server 127.0.0.1:3100; keepalive 16; }
upstream zhongjian_eap_site_dev   { server 127.0.0.1:3111; keepalive 8; }
upstream zhongjian_eap_site_test  { server 127.0.0.1:3112; keepalive 8; }
upstream zhongjian_eap_site_local { server 127.0.0.1:3110; keepalive 4; }

# HTTP → HTTPS + ACME
server {
    listen 80;
    listen [::]:80;
    server_name corp.eap.ji-psy.com
                local.corp.eap.ji-psy.com
                dev.corp.eap.ji-psy.com
                test.corp.eap.ji-psy.com
                zhongjiansanju.eap.ji-psy.com;
    server_tokens off;
    access_log /data/mini_program/logs/zhongjian-eap/nginx.http.access.log;
    error_log  /data/mini_program/logs/zhongjian-eap/nginx.http.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 共用 SSL 片段
# --- prod: corp.eap（无环境前缀）→ :3100 → mini-production ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name corp.eap.ji-psy.com zhongjiansanju.eap.ji-psy.com;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/corp.eap.ji-psy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corp.eap.ji-psy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 10m;
    access_log /data/mini_program/logs/zhongjian-eap/nginx.access.log;
    error_log  /data/mini_program/logs/zhongjian-eap/nginx.error.log warn;

    # 历史企业链接（原 corp→mini-dev）：永久跳到新规则 dev 子域
    location = /onboarding/52d461b017e228a42c57964956984347 { return 301 https://dev.corp.eap.ji-psy.com/onboarding/52d461b017e228a42c57964956984347; }
    location = /onboarding/a420a2736ff5496bd3d35e4c78d4120c { return 301 https://dev.corp.eap.ji-psy.com/onboarding/a420a2736ff5496bd3d35e4c78d4120c; }
    location = /onboarding/a790667648a15d2d7c5df963ce71c13d { return 301 https://dev.corp.eap.ji-psy.com/onboarding/a790667648a15d2d7c5df963ce71c13d; }
    location = /onboarding/5dc6ce53f417e0282a0ca7e74d174909 { return 301 https://dev.corp.eap.ji-psy.com/onboarding/5dc6ce53f417e0282a0ca7e74d174909; }
    location = /onboarding/4fca33fbe778fac7bdfc517689910066 { return 301 https://dev.corp.eap.ji-psy.com/onboarding/4fca33fbe778fac7bdfc517689910066; }
    location = /52d461b017e228a42c57964956984347 { return 301 https://dev.corp.eap.ji-psy.com/52d461b017e228a42c57964956984347; }
    location = /a420a2736ff5496bd3d35e4c78d4120c { return 301 https://dev.corp.eap.ji-psy.com/a420a2736ff5496bd3d35e4c78d4120c; }
    location = /a790667648a15d2d7c5df963ce71c13d { return 301 https://dev.corp.eap.ji-psy.com/a790667648a15d2d7c5df963ce71c13d; }
    location = /5dc6ce53f417e0282a0ca7e74d174909 { return 301 https://dev.corp.eap.ji-psy.com/5dc6ce53f417e0282a0ca7e74d174909; }
    location = /4fca33fbe778fac7bdfc517689910066 { return 301 https://dev.corp.eap.ji-psy.com/4fca33fbe778fac7bdfc517689910066; }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://zhongjian_eap_site_prod;
    }
}

